<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    @page { size: 1080px 1350px; margin: 0; }
    body {
      background-color: #090D14;
      color: #F9FAFB;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      width: 1080px;
    }
    .slide {
      width: 1080px;
      height: 1350px;
      page-break-after: always;
      break-after: page;
      position: relative;
      background: radial-gradient(circle at 85% 15%, rgba(191, 161, 117, 0.09) 0%, transparent 50%),
                  radial-gradient(circle at 15% 85%, rgba(37, 99, 235, 0.06) 0%, transparent 50%),
                  #090D14;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .slide::before {
      content: '';
      position: absolute;
      inset: 0;
      background-size: 60px 60px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      pointer-events: none;
    }
    .slide-inner {
      width: 1080px;
      height: 1350px;
      padding: 90px 85px 85px 85px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 28px;
    }
    .brand-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.12em;
    }
    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #BFA175;
      box-shadow: 0 0 12px rgba(191, 161, 117, 0.6);
    }
    .brand-name { color: #F9FAFB; }
    .slide-counter {
      font-family: monospace;
      font-size: 19px;
      font-weight: 700;
      color: #BFA175;
      letter-spacing: 0.05em;
    }
    .slide-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-grow: 1;
      padding: 40px 0;
    }
    .tag {
      display: inline-block;
      align-self: flex-start;
      padding: 8px 18px;
      background: rgba(191, 161, 117, 0.1);
      border: 1px solid rgba(191, 161, 117, 0.35);
      border-radius: 3px;
      color: #D1B892;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    .slide-title {
      font-family: 'Fraunces', serif;
      font-size: 58px;
      line-height: 1.12;
      font-weight: 700;
      color: #F9FAFB;
      letter-spacing: -0.02em;
      margin-bottom: 30px;
    }
    .divider {
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, #BFA175, rgba(191, 161, 117, 0.1));
      margin-bottom: 34px;
    }
    .slide-body {
      font-size: 26px;
      line-height: 1.55;
      color: #D1D5DB;
      font-weight: 300;
      max-width: 920px;
    }
    .metric-box {
      margin-top: 45px;
      background: #161D2B;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-left: 4px solid #BFA175;
      border-radius: 6px;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .metric-label {
      font-size: 12px;
      letter-spacing: 0.18em;
      color: #9CA3AF;
      font-weight: 600;
    }
    .metric-value {
      font-size: 38px;
      font-weight: 700;
      color: #F9FAFB;
    }
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 26px;
      font-size: 13px;
      letter-spacing: 0.14em;
    }
    .footer-note { color: #6B7280; }
    .footer-hint { color: #BFA175; font-weight: 600; }
  </style>
</head>
<body>
  {{SLIDES}}
</body>
</html>
