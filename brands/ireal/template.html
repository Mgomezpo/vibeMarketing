<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    @page { size: 1080px 1350px; margin: 0; }
    body {
      background-color: #0B0B0B;
      color: #F8F6F1;
      font-family: 'Outfit', system-ui, sans-serif;
      width: 1080px;
    }
    .slide {
      width: 1080px;
      height: 1350px;
      page-break-after: always;
      break-after: page;
      position: relative;
      background: radial-gradient(circle at 90% 10%, rgba(159, 21, 34, 0.18) 0%, transparent 55%),
                  radial-gradient(circle at 10% 90%, rgba(110, 11, 20, 0.12) 0%, transparent 60%),
                  #0B0B0B;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Grano analógico cálido de cuaderno */
    .slide::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    .slide-inner {
      width: 1080px;
      height: 1350px;
      padding: 95px 85px 85px 85px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }
    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      padding-bottom: 24px;
    }
    .brand-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.14em;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #9F1522;
      box-shadow: 0 0 14px rgba(159, 21, 34, 0.7);
    }
    .brand-name {
      color: #F8F6F1;
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-size: 18px;
    }
    .slide-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: #9F1522;
      font-weight: 600;
    }
    .slide-main {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-grow: 1;
      padding: 40px 0;
    }
    .tag {
      display: inline-block;
      align-self: flex-start;
      padding: 7px 16px;
      background: rgba(159, 21, 34, 0.15);
      border: 1px solid rgba(159, 21, 34, 0.4);
      border-radius: 4px;
      color: #E27B86;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 30px;
    }
    .slide-title {
      font-family: 'Fraunces', serif;
      font-size: 56px;
      line-height: 1.15;
      font-weight: 700;
      color: #F8F6F1;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
    }
    .divider {
      width: 70px;
      height: 3px;
      background: #9F1522;
      margin-bottom: 32px;
      border-radius: 2px;
    }
    .slide-body {
      font-size: 27px;
      line-height: 1.55;
      color: #D6D3CD;
      font-weight: 300;
      max-width: 900px;
    }
    .metric-box {
      margin-top: 45px;
      background: rgba(22, 13, 15, 0.8);
      border: 1px solid rgba(159, 21, 34, 0.3);
      border-left: 4px solid #9F1522;
      border-radius: 6px;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .metric-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      color: #A8A29E;
    }
    .metric-value {
      font-family: 'Fraunces', serif;
      font-size: 36px;
      font-weight: 700;
      color: #F8F6F1;
    }
    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 24px;
      font-size: 13px;
      letter-spacing: 0.12em;
    }
    .footer-note { color: #78716C; }
    .footer-hint { color: #9F1522; font-weight: 600; }
  </style>
</head>
<body>
  {{SLIDES}}
</body>
</html>
