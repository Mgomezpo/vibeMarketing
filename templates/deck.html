<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TIA — Carousel Engine Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    /* Variables dinámicas inyectadas por el compilador desde design_tokens.json */
    --bg-color: #000000;
    --primary-text: #FFFFFF;
    --secondary-text: #E8E0D0;
    --accent-color: #F0B429;
    --muted-color: #888888;
    --negative-color: #E05252;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --font-serif: 'Fraunces', serif;
    --font-sans: 'Space Grotesk', sans-serif;
    --font-mono: 'Space Mono', monospace;
    --font-body: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-color);
    color: var(--secondary-text);
    font-family: var(--font-body), sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 40px 0;
    -webkit-font-smoothing: antialiased;
  }

  /* CANVAS SLIDE NATIVO 4:5 */
  .slide {
    width: 1080px;
    height: 1350px;
    background-color: var(--bg-color);
    position: relative;
    overflow: hidden;
    padding: 70px 64px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid rgba(255, 255, 255, 0.05);
    page-break-after: always;
    break-after: page;
  }

  /* IMAGEN DE FONDO CINEMÁTICA CON ANCLAJE INFERIOR */
  .slide-bg {
    position: absolute;
    inset: 0;
    background-size: 78% auto;
    background-position: center bottom;
    background-repeat: no-repeat;
    z-index: 1;
    pointer-events: none;
  }

  .slide-content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .slide-main-content {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
  }

  /* CABECERA EDITORIAL */
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 22px;
  }
  .header-brand {
    font-family: var(--font-mono), monospace;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent-color);
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
  }
  .header-brand::before {
    content: "";
    width: 8px;
    height: 8px;
    background: var(--accent-color);
    display: inline-block;
  }
  .header-step {
    font-family: var(--font-mono), monospace;
    font-size: 13px;
    letter-spacing: 0.16em;
    color: var(--muted-color);
    text-transform: uppercase;
  }

  /* PIE TÉCNICO */
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border-subtle);
    padding-top: 22px;
    font-family: var(--font-mono), monospace;
    font-size: 12px;
    color: var(--muted-color);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: auto;
  }
  .footer-cta {
    color: var(--accent-color);
    font-weight: 700;
  }

  /* TIPOGRAFÍA PURA Y CLASES AUXILIARES */
  .gold-text, .accent-text { color: var(--accent-color); }
  .section-title-wrap { margin-top: 20px; }
  .headline-serif {
    font-family: var(--font-serif), serif;
    font-weight: 300;
    font-style: italic;
    font-size: 40px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: var(--primary-text);
  }
  .headline-sans {
    font-family: var(--font-sans), sans-serif;
    font-weight: 800;
    font-size: 44px;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: var(--accent-color);
    text-transform: uppercase;
    margin-top: 4px;
  }
  .section-lead {
    font-size: 18px;
    line-height: 1.45;
    color: var(--secondary-text);
    opacity: 0.85;
    margin-top: 10px;
    max-width: 850px;
  }

  /* SLIDE 01: COVER */
  .masthead { margin-top: 24px; }
  .masthead-tag {
    font-family: var(--font-mono), monospace;
    font-size: 14px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted-color);
    margin-bottom: 16px;
  }
  .masthead-serif {
    font-family: var(--font-serif), serif;
    font-weight: 300;
    font-style: italic;
    font-size: 72px;
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: var(--primary-text);
    max-width: 620px;
  }
  .masthead-sans {
    font-family: var(--font-sans), sans-serif;
    font-weight: 800;
    font-size: 50px;
    line-height: 1.0;
    letter-spacing: -0.03em;
    color: var(--accent-color);
    text-transform: uppercase;
    margin-top: 8px;
    max-width: 620px;
  }
  .cover-subtitle {
    font-size: 20px;
    line-height: 1.45;
    color: var(--secondary-text);
    max-width: 520px;
    margin-top: 32px;
  }

  /* SLIDE 02: SPLIT */
  .split-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
    margin-top: 24px;
    max-width: 960px;
  }
  .split-col {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .split-col.right-col {
    border-left: 1px solid rgba(240, 180, 41, 0.25);
    padding-left: 36px;
  }
  .col-tag {
    font-family: var(--font-mono), monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted-color);
    margin-bottom: 10px;
  }
  .col-tag.gold, .col-tag.accent { color: var(--accent-color); }
  .col-title {
    font-family: var(--font-sans), sans-serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--primary-text);
    line-height: 1.2;
    margin-bottom: 10px;
  }
  .col-body {
    font-size: 16px;
    line-height: 1.45;
    color: var(--secondary-text);
    opacity: 0.9;
  }
  .col-stat {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border-subtle);
  }
  .stat-num {
    font-family: var(--font-sans), sans-serif;
    font-weight: 800;
    font-size: 46px;
    line-height: 1;
    color: var(--accent-color);
  }
  .stat-num.negative { color: var(--negative-color); }
  .stat-desc {
    font-family: var(--font-mono), monospace;
    font-size: 11px;
    color: var(--muted-color);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* SLIDE 03: COMPARE */
  .quote-container {
    border-left: 3px solid var(--accent-color);
    padding-left: 18px;
    margin: 14px 0 18px;
  }
  .quote-text {
    font-family: var(--font-serif), serif;
    font-style: italic;
    font-weight: 300;
    font-size: 18px;
    line-height: 1.35;
    color: var(--primary-text);
    max-width: 840px;
  }
  .compare-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 48px;
  }
  .compare-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .compare-col.pro {
    border-left: 1px solid rgba(240, 180, 41, 0.25);
    padding-left: 36px;
  }
  .compare-header {
    font-family: var(--font-sans), sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--primary-text);
    margin-bottom: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .compare-badge {
    font-family: var(--font-mono), monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted-color);
  }
  .compare-col.pro .compare-badge { color: var(--accent-color); }
  .compare-item {
    font-size: 14px;
    line-height: 1.35;
    color: var(--secondary-text);
    opacity: 0.85;
    position: relative;
    padding-left: 22px;
  }
  .compare-item::before {
    content: "—";
    position: absolute;
    left: 0;
    color: var(--negative-color);
    font-weight: 700;
  }
  .compare-col.pro .compare-item {
    color: var(--secondary-text);
    opacity: 1;
  }
  .compare-col.pro .compare-item::before {
    content: "✓";
    color: var(--accent-color);
  }

  /* SLIDE 04: STEPS */
  .steps-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 20px;
  }
  .step-row {
    display: grid;
    grid-template-columns: 65px 1fr;
    gap: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .step-row:last-child { border-bottom: none; }
  .step-number {
    font-family: var(--font-mono), monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--muted-color);
    line-height: 1;
  }
  .step-row.highlight .step-number { color: var(--accent-color); }
  .step-title {
    font-family: var(--font-sans), sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--primary-text);
    margin-bottom: 4px;
  }
  .step-row.highlight .step-title { color: var(--accent-color); }
  .step-body {
    font-size: 14px;
    line-height: 1.4;
    color: var(--secondary-text);
    opacity: 0.8;
  }
  .step-row.highlight .step-body {
    color: var(--secondary-text);
    opacity: 1;
  }

  /* SLIDE 05: CTA */
  .cta-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    margin: 36px 0 44px;
    padding-bottom: 36px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .cta-metric-item { display: flex; flex-direction: column; }
  .cta-metric-val {
    font-family: var(--font-sans), sans-serif;
    font-weight: 800;
    font-size: 64px;
    line-height: 1;
    color: var(--accent-color);
    margin-bottom: 8px;
  }
  .cta-metric-desc {
    font-family: var(--font-mono), monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted-color);
    line-height: 1.4;
  }
  .cta-action-wrap { max-width: 820px; }
  .cta-tag-badge {
    display: inline-block;
    font-family: var(--font-mono), monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent-color);
    margin-bottom: 12px;
  }
  .cta-main-title {
    font-family: var(--font-sans), sans-serif;
    font-weight: 800;
    font-size: 46px;
    color: var(--primary-text);
    margin-bottom: 14px;
    letter-spacing: -0.02em;
  }
  .cta-main-desc {
    font-size: 19px;
    line-height: 1.5;
    color: var(--secondary-text);
    opacity: 0.85;
  }

  @page {
    size: 1080px 1350px;
    margin: 0;
  }
  @media print {
    body {
      padding: 0 !important;
      margin: 0 !important;
      gap: 0 !important;
      background: var(--bg-color) !important;
    }
    .slide {
      border: none !important;
      page-break-after: always !important;
      break-after: page !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }
  }
</style>
</head>
<body>

  <div id="deck">
    <!-- SLIDES_INJECTED_HERE -->
  </div>

</body>
</html>
