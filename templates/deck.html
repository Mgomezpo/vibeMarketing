<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TIA — Editorial Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300..800&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: #000; 
    color: #E8E0D0; 
    font-family: 'Inter', sans-serif; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    gap: 0; 
    -webkit-font-smoothing: antialiased; 
  }

  .slide {
    width: 1080px;
    height: 1350px;
    background: #000;
    position: relative;
    overflow: hidden;
    padding: 80px 70px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    page-break-after: always;
  }

  .slide-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center bottom;
    background-repeat: no-repeat;
    z-index: 1;
    pointer-events: none;
  }

  .slide-content {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #888;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 20px;
    margin-bottom: 40px;
  }
  .header-brand { color: #F0B429; font-weight: 700; }

  /* TYPOGRAPHY SYSTEM - NAKED */
  .title-serif {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 80px;
    line-height: 0.9;
    color: #FFFFFF;
    margin-bottom: 10px;
  }
  .title-sans {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800;
    font-size: 60px;
    line-height: 1;
    color: #F0B429;
    text-transform: uppercase;
    margin-bottom: 30px;
  }
  .lead-text {
    font-size: 22px;
    line-height: 1.5;
    color: #D0C8B8;
    max-width: 800px;
    margin-bottom: 40px;
  }

  /* GRID-LESS CONTENT */
  .content-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    margin-top: 20px;
  }
  .col { display: flex; flex-direction: column; gap: 15px; }
  .col-tag { 
    font-family: 'Space Mono', monospace; 
    font-size: 12px; 
    color: #888; 
    text-transform: uppercase; 
    letter-spacing: 0.1em; 
  }
  .col-title { 
    font-family: 'Space Grotesk', sans-serif; 
    font-size: 24px; 
    font-weight: 700; 
    color: #FFF; 
  }
  .col-body { font-size: 17px; line-height: 1.5; color: #B0B0B0; }
  .stat-box { margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
  .stat-val { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 48px; color: #F0B429; }
  .stat-label { font-family: 'Space Mono', monospace; font-size: 11px; color: #888; text-transform: uppercase; }

  /* FOOTER */
  .footer {
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: #666;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 20px;
  }
  .footer-gold { color: #F0B429; }

  @media print {
    body { padding: 0; background: #000; }
    .slide { border: none; }
  }
</style>
</head>
<body>
  <!-- This is a template. The Compiler will inject slides here -->
  <div id="deck"></div>
</body>
</html>
